<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0
        "
    >

    <title>
        TrendThread
    </title>


    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>
            🧵 TrendThread
        </h1>

        <p>
            Discover trending colors
            and fabrics
        </p>

    </header>


    <!-- NAVIGATION -->

    <nav>


        <!-- SEARCH -->

        <div
            class="search-menu"
        >

            <button
                id="searchMenu"
            >

                🔍 Search ▼

            </button>


            <div
                id="searchOptions"
                class="dropdown"
            >


                <button
                    class="trend-option"
                    data-category="colors"
                >

                    🎨 Trending Colors

                </button>


                <button
                    class="trend-option"
                    data-category="fabrics"
                >

                    🧵 Trending Fabrics

                </button>


                <button
                    class="trend-option"
                    data-category="both"
                >

                    🎨🧵 Both

                </button>


            </div>

        </div>


        <!-- HISTORY -->

        <button
            id="historyButton"
        >

            🕒 History

        </button>


        <!-- SAVED -->

        <button
            id="savedButton"
        >

            🔖 Saved

        </button>


    </nav>


    <!-- RESULTS -->

    <main
        id="results"
    >

        <h2>
            Welcome to TrendThread
        </h2>

        <p>
            Choose a category from
            Search to explore
            live textile trends.
        </p>

    </main>


    <!-- JAVASCRIPT -->

    <script
        src="/static/js/script.js"
    ></script>


</body>

</html>
